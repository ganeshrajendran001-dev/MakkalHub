<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Profile - MakkalHub Admin</title>

    <link rel="stylesheet"
          href="css/style.css">


    <style>

        /* ================================
           PROFESSIONAL PASSWORD EYE
           ================================ */

        .password-wrapper {
            position: relative !important;
            width: 100% !important;
        }

        .password-wrapper input {
            width: 100% !important;
            padding-right: 50px !important;
            box-sizing: border-box !important;
        }

        .password-wrapper .password-eye {
            position: absolute !important;

            right: 10px !important;
            top: 50% !important;

            transform: translateY(-50%) !important;

            width: 32px !important;
            height: 32px !important;

            margin: 0 !important;
            padding: 5px !important;

            border: none !important;
            border-radius: 50% !important;

            background: transparent !important;
            background-color: transparent !important;

            color: #555 !important;

            box-shadow: none !important;

            cursor: pointer !important;

            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .password-wrapper .password-eye:hover {
            background: transparent !important;
            background-color: transparent !important;
            box-shadow: none !important;
        }

        .password-wrapper .password-eye svg {
            width: 21px !important;
            height: 21px !important;

            fill: none !important;
            stroke: #555 !important;

            stroke-width: 1.8 !important;
            stroke-linecap: round !important;
            stroke-linejoin: round !important;
        }

        .password-wrapper .password-eye:hover svg {
            stroke: #075f3d !important;
        }

        .password-wrapper .password-eye:focus {
            outline: none !important;
            background: transparent !important;
            box-shadow: none !important;
        }


        /* ================================
           PROFILE INFORMATION
           ================================ */

        .profile-info {
            margin-bottom: 25px;
        }

        .profile-info p {
            margin: 12px 0;
            font-size: 16px;
        }

        .profile-info strong {
            display: inline-block;
            min-width: 130px;
        }


        /* ================================
           PASSWORD SECTION
           ================================ */

        .password-section {
            margin-top: 25px;
        }

        #passwordMessage {
            margin-top: 15px;
            font-weight: 600;
            text-align: center;
        }

    </style>

</head>


<body>


    <!-- Admin Header -->

    <header>

        <div class="logo">
            🌐 MakkalHub
        </div>


        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="index.html">
                View Website
            </a>

            <a
                href="#"
                class="admin-btn"
                id="logoutBtn"
            >
                Logout
            </a>

        </nav>

    </header>



    <!-- Admin Profile -->

    <section class="admin-form-container">


        <div class="form-heading">

            <h1>
                👤 Admin Profile
            </h1>


            <p>
                Manage your administrator account
                and password
            </p>

        </div>



        <!-- Account Information -->

        <div class="dashboard-card profile-info">

            <h2>
                Account Information
            </h2>


            <p>

                <strong>
                    Username:
                </strong>

                <span id="adminUsername">
                    admin
                </span>

            </p>


            <p>

                <strong>
                    Account Type:
                </strong>

                Administrator

            </p>

        </div>



        <!-- Change Password -->

        <div class="dashboard-card password-section">

            <h2>
                🔐 Change Password
            </h2>


            <form id="changePasswordForm">


                <!-- Current Password -->

                <div class="form-group">

                    <label for="currentPassword">
                        Current Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="currentPassword"
                            placeholder="Enter current password"
                            required
                        >


                        <button
                            type="button"
                            class="password-eye"
                            data-target="currentPassword"
                            aria-label="Show password"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                                ></path>


                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                ></circle>

                            </svg>

                        </button>

                    </div>

                </div>



                <!-- New Password -->

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            required
                        >


                        <button
                            type="button"
                            class="password-eye"
                            data-target="newPassword"
                            aria-label="Show password"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                                ></path>


                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                ></circle>

                            </svg>

                        </button>

                    </div>

                </div>



                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            required
                        >


                        <button
                            type="button"
                            class="password-eye"
                            data-target="confirmPassword"
                            aria-label="Show password"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                                ></path>


                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                ></circle>

                            </svg>

                        </button>

                    </div>

                </div>



                <!-- Change Password Button -->

                <button
                    type="submit"
                    class="save-button"
                >

                    🔑 Change Password

                </button>


                <!-- Message -->

                <p id="passwordMessage"></p>


            </form>

        </div>


    </section>



    <!-- Footer -->

    <footer>

        <h3>
            MakkalHub - Admin Panel
        </h3>


        <p>
            Manage administrator account securely
        </p>

    </footer>



    <script src="js/admin-profile.js"></script>

    <script src="js/logout.js"></script>


</body>

</html>
