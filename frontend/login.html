<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - MakkalHub</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>


    <div class="login-page">


        <div class="login-box">


            <div class="login-icon">
                🔐
            </div>


            <h1>
                Admin Login
            </h1>


            <p>
                MakkalHub Administration
            </p>


            <form id="loginForm"
                  autocomplete="off">


                <!-- Username -->

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="admin_username"
                        placeholder="Enter username"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="admin_password"
                            placeholder="Enter password"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            class="password-eye"
                            id="togglePassword"
                            aria-label="Show password"
                            title="Show password"
                        >

                            <svg
                                id="eyeIcon"
                                viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                            >

                                <path
                                    d="M2 12s3.5-7 10-7
                                       10 7 10 7
                                       -3.5 7-10 7
                                       -10-7-10-7z"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                />

                            </svg>

                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Login

                </button>


                <p id="loginMessage"></p>


            </form>


            <a
                href="../index.html"
                class="back-home"
            >

                ← Back to MakkalHub

            </a>


        </div>


    </div>


    <script src="../js/login.js"></script>


</body>

</html>
